name: Bug report
description: Something is wrong with the bar, the install, or the notifications.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, run `ai-quota-meter --doctor`. Six checks, each one
        saying how to fix what it found — it catches most setup problems on
        its own, and its output is the single most useful thing in a report.

        **A blank bar is often not a fault.** The quota figures arrive only on
        plans that receive them, and not until the first API response of a
        session. If the doctor is clean and you have just started a session,
        give it a turn or two.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
      placeholder: |
        The bar shows the model and directory but never the quota windows,
        even after twenty turns.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `ai-quota-meter --doctor`
      description: Paste it whole. It is rendered as a code block, so no backticks needed.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ai-quota-meter --version`.
      placeholder: v0.3.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options:
        - Claude Code
        - OpenAI Codex
        - Both
        - Neither / something else
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The steps, if you can pin them down. "Every session since I upgraded" is a fine answer.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Read the doctor output before you paste it — this issue is public.**

        It always prints your home directory, so it names your username. And
        if the `last capture` check is more than two days stale — which is
        exactly the case you are probably reporting — it prints the capture
        file path, which has your **Claude account UUID** in it:

        ```
        /home/YOU/.cache/api-dashboard/rate-limits-<account-uuid>.json
        ```

        Replace your username with `YOU` and shorten the UUID to its first
        four characters. A shortened id is still useful to us; a full one is
        not more useful, just more public.
