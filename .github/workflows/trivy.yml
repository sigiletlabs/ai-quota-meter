name: trivy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A scan only on push tells you nothing about a CVE published after the
    # last commit, and this repo is quiet by design.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: trivy fs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          # SARIF goes to code scanning, which is where severity is triaged.
          # Failing the job here as well would double-report.
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
